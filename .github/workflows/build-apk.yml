name: APK do Gestor Florestal

on:
  push:
    branches: [main, validacao/android-apk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_ANDROID_BUNDLE_VERSION: ${{ github.run_number }}.${{ github.run_attempt }}.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: npm ci --legacy-peer-deps
      - run: npm run build:android
      - run: npx cap sync android
      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GestorFlorestal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Preparar bundle OTA
        if: github.ref == 'refs/heads/main'
        run: |
          (cd dist && zip -qr ../web-bundle.zip .)
          CHECKSUM="$(sha256sum web-bundle.zip | cut -d ' ' -f 1)"
          NATIVE_VERSION="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle)"
          test -n "$NATIVE_VERSION"
          printf '{"version":"%s","url":"https://github.com/%s/releases/download/ota-%s/web-bundle.zip","checksum":"%s","nativeVersion":"%s"}\n' \
            "$VITE_ANDROID_BUNDLE_VERSION" "$GITHUB_REPOSITORY" "$VITE_ANDROID_BUNDLE_VERSION" "$CHECKSUM" "$NATIVE_VERSION" > version.json
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: GestorFlorestal-OTA
          path: |
            web-bundle.zip
            version.json
          if-no-files-found: error

  publicar-ota:
    if: github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GestorFlorestal-OTA
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-${{ github.run_number }}.${{ github.run_attempt }}.0
          name: Gestor Florestal OTA ${{ github.run_number }}.${{ github.run_attempt }}.0
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            web-bundle.zip
            version.json
