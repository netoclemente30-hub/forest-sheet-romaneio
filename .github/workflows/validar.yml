name: Validar Gestor Florestal

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependências com lockfile
        run: bun install --frozen-lockfile
      - name: Testes automatizados
        run: bun run test
      - name: Análise estática (sem bloqueio por estilo legado)
        run: bunx eslint . --rule "prettier/prettier: off"
      - name: Compilar aplicação
        run: bun run build
