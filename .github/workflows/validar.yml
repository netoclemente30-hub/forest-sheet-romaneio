name: Validar Gestor Florestal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependências com lockfile
        run: bun install --frozen-lockfile
      - name: Verificar sintaxe das migrações PostgreSQL
        run: |
          python -m pip install --disable-pip-version-check pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          arquivos = sorted(Path("drizzle/migrations").glob("003[678]_*.sql"))
          if len(arquivos) != 3:
              raise SystemExit(f"Esperadas 3 migrações novas, encontradas {len(arquivos)}")
          for arquivo in arquivos:
              parse_sql(arquivo.read_text(encoding="utf-8"))
              print(f"SQL sintaticamente válido: {arquivo}")
          PY
      - name: Testes automatizados
        run: bun run test
      - name: Análise estática (sem bloqueio por estilo legado)
        run: |
          bunx eslint . --rule "prettier/prettier: off"
      - name: Conferir tipos TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Compilar aplicação
        run: bun run build
